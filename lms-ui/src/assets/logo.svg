<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#40916c" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f3e5ab" />
    </linearGradient>

    <!-- Circular Text Path -->
    <path id="textCircle" d="M 100, 250 a 150,150 0 1,1 300,0 a 150,150 0 1,1 -300,0" />

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Wreath & Circle Border -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#1b4332" stroke-width="4" stroke-dasharray="8 6" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#40916c" stroke-width="3" />

  <!-- Outer Leaf Wreath Border -->
  <g fill="#2d6a4f">
    <!-- Left Wreath Leaf Clusters -->
    <path d="M 75 220 C 60 200, 70 175, 85 180 C 80 195, 75 208, 75 220 Z" />
    <path d="M 65 260 C 50 240, 60 215, 75 220 C 70 235, 65 248, 65 260 Z" />
    <path d="M 70 300 C 55 280, 65 255, 80 260 C 75 275, 70 288, 70 300 Z" />
    <!-- Right Wreath Leaf Clusters -->
    <path d="M 425 220 C 440 200, 430 175, 415 180 C 420 195, 425 208, 425 220 Z" />
    <path d="M 435 260 C 450 240, 440 215, 425 220 C 430 235, 435 248, 435 260 Z" />
    <path d="M 430 300 C 445 280, 435 255, 420 260 C 425 275, 430 288, 430 300 Z" />
  </g>

  <!-- Sun Emblem at Top Center -->
  <g transform="translate(250, 60)" fill="url(#goldAccent)">
    <circle cx="0" cy="0" r="14" />
    <path d="M 0 -22 L 0 -16 M -16 -16 L -11 -11 M -22 0 L -16 0 M -16 16 L -11 11 M 0 22 L 0 16 M 16 16 L 11 11 M 22 0 L 16 0 M 16 -16 L 11 -11" stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Top Curved Motto -->
  <text font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="#1b4332" letter-spacing="4">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      FOSTERING KNOWLEDGE
    </textPath>
  </text>

  <!-- Central Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Open Book Base -->
    <g id="open-book">
      <!-- Left Page -->
      <path d="M 250 310 C 210 285, 150 290, 120 300 L 120 325 C 150 315, 210 310, 250 335 Z" fill="#2d6a4f" />
      <path d="M 250 305 C 210 280, 150 285, 125 295 L 125 318 C 150 308, 210 303, 250 328 Z" fill="#ffffff" />
      
      <!-- Right Page -->
      <path d="M 250 310 C 290 285, 350 290, 380 300 L 380 325 C 350 315, 290 310, 250 335 Z" fill="#1b4332" />
      <path d="M 250 305 C 290 280, 350 285, 375 295 L 375 318 C 350 308, 290 303, 250 328 Z" fill="#e8f5e9" />
      
      <!-- Center Book Spine -->
      <path d="M 250 280 L 250 335" stroke="#1b4332" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Tree of Knowledge Growing from Book -->
    <g id="tree-of-knowledge">
      <!-- Trunk / Book Sprout -->
      <path d="M 246 305 C 245 250, 230 220, 250 170 C 270 220, 255 250, 254 305 Z" fill="#1b4332" />
      
      <!-- Sprouting Center Leaves -->
      <path d="M 250 250 C 220 230, 200 200, 210 180 C 230 190, 245 220, 250 250 Z" fill="url(#leafGrad)" />
      <path d="M 250 250 C 280 230, 300 200, 290 180 C 270 190, 255 220, 250 250 Z" fill="#52b788" />

      <!-- Main Leaf Canopy -->
      <!-- Center Main Leaf -->
      <path d="M 250 170 C 235 130, 250 100, 250 100 C 250 100, 265 130, 250 170 Z" fill="#2d6a4f" />
      <!-- Left Crown Leaves -->
      <path d="M 245 155 C 215 135, 205 110, 205 110 C 205 110, 230 120, 245 155 Z" fill="#52b788" />
      <path d="M 240 175 C 200 165, 180 145, 180 145 C 180 145, 205 150, 240 175 Z" fill="#74c69d" />
      <!-- Right Crown Leaves -->
      <path d="M 255 155 C 285 135, 295 110, 295 110 C 295 110, 270 120, 255 155 Z" fill="#40916c" />
      <path d="M 260 175 C 300 165, 320 145, 320 145 C 320 145, 295 150, 260 175 Z" fill="#52b788" />

      <!-- Small Apple/Seed Orbs -->
      <circle cx="215" cy="135" r="5" fill="url(#goldAccent)" />
      <circle cx="285" cy="135" r="5" fill="url(#goldAccent)" />
      <circle cx="250" cy="120" r="5" fill="url(#goldAccent)" />
      <circle cx="195" cy="165" r="4" fill="url(#goldAccent)" />
      <circle cx="305" cy="165" r="4" fill="url(#goldAccent)" />
    </g>
  </g>

  <!-- School Name Text -->
  <text x="250" y="380" font-family="'Arial Black', Gadget, sans-serif" font-size="28" font-weight="900" fill="#1b4332" text-anchor="middle" letter-spacing="2">
    GREENWOOD
  </text>
  <text x="250" y="405" font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="#2d6a4f" text-anchor="middle" letter-spacing="3">
    ACADEMY
  </text>

  <!-- Bottom Ribbon Banner with Motto -->
  <g id="bottom-banner" transform="translate(0, 115)">
    <!-- Ribbon Back/Folds -->
    <path d="M 100 280 L 135 260 L 135 295 Z" fill="#1b4332" />
    <path d="M 400 280 L 365 260 L 365 295 Z" fill="#1b4332" />
    
    <!-- Ribbon Tails -->
    <path d="M 85 298 L 135 260 L 135 298 L 95 318 Z" fill="#2d6a4f" />
    <path d="M 415 298 L 365 260 L 365 298 L 405 318 Z" fill="#2d6a4f" />
    
    <!-- Main Ribbon Body -->
    <path d="M 120 270 Q 250 290 380 270 L 370 305 Q 250 325 130 305 Z" fill="url(#emeraldGrad)" stroke="url(#goldAccent)" stroke-width="1.5" />
    
    <!-- Banner Text -->
    <text x="250" y="296" font-family="'Arial', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">
      SUPPORT GREEN SCHOOLS
    </text>
  </g>

  <!-- Est. Year -->
  <text x="250" y="460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#40916c" text-anchor="middle" letter-spacing="2">
    EST. 2023
  </text>
</svg>
