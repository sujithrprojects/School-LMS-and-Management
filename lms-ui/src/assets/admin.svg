  <path d="M32 15L45 20V30C45 38.5 39.5 45.5 32 48C24.5 45.5 19 38.5 19 30V20L32 15Z" fill="none" stroke="url(#adminGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#adminGlow)"/>

