<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="--logo-color: #ec4899;">
  <defs>
    <linearGradient id="adminGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--logo-color, #ec4899)"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="adminGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Background Circle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#adminGrad)" fill-opacity="0.15" stroke="url(#adminGrad)" stroke-width="1.5"/>

