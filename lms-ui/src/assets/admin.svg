  <circle cx="32" cy="30" r="5" stroke="#f8fafc" stroke-width="2.5"/>
  <path d="M32 22V24M32 36V38M24 30H26M38 30H40M26.34 24.34L27.75 25.75M36.25 34.25L37.66 35.66M26.34 35.66L27.75 34.25M36.25 25.75L37.66 24.34" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
</svg>
